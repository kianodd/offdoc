<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e0234e">
<meta name="description" content="OffDoc — download documentation capsules, load them, read offline.">
<title>OffDoc</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="js/vendor/highlight.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="js/vendor/highlight-dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="css/style.css">
<script src="js/version.js"></script>
<script src="js/vendor/jszip.min.js" defer></script>
<script src="js/vendor/marked.min.js" defer></script>
<script src="js/vendor/highlight.min.js" defer></script>
<script src="js/app.js" defer></script>
</head>
<body>
<div id="app">
  <aside class="sidebar" aria-label="Sidebar">
    <div class="brand"><img src="icons/icon-192.png" alt=""><div><b>OffDoc</b><span id="sideVer"></span></div></div>
    <nav class="side-nav" id="sideNav" aria-label="Tabs"></nav>
    <div class="side-toc" id="sideToc" hidden></div>
  </aside>

  <main id="main">
    <div class="topbar">
      <div class="brand-mini"><img src="icons/icon-192.png" alt=""><span>OffDoc</span></div>
    </div>

    <!-- Capsules tab -->
    <section class="view" id="view-capsules" aria-label="Capsules">
      <div class="page-head"><h1 data-i18n="capsulesTitle"></h1><p data-i18n="capsulesSub"></p></div>
      <div class="group" id="capsuleList" role="list"></div>
      <p class="foot" data-i18n="downloadNote"></p>
    </section>

    <!-- Reading tab -->
    <section class="view" id="view-reader" aria-label="Reading">
      <div id="readerEmpty" class="empty">
        <div class="sym" aria-hidden="true">▤</div>
        <h2 data-i18n="noCapsuleTitle"></h2>
        <p data-i18n="noCapsuleSub"></p>
      <div class="dropzone" id="dropzone" tabindex="0">
        <div class="sym" aria-hidden="true">▣</div>
        <p data-i18n="dropHint"></p>
        <button class="btn" id="pickBtn" type="button" data-i18n="loadButton"></button>
      </div>
      </div>
      <div id="readerMain" class="reader-wrap" hidden>
        <div class="reader-tools">
          <button class="btn secondary" id="capsBtn" type="button">▣ <span data-i18n="loadedCapsules"></span> <span class="badge" id="capsCount"></span></button>
        </div>
        <div class="page-head"><h1 id="docTitle"></h1><p id="docMeta"></p></div>
        <div class="group toc-card">
          <div class="toc-head"><b data-i18n="toc"></b><span id="tocCount"></span></div>
          <div class="toc-list" id="readerToc"></div>
        </div>
        <article class="doc" id="docBody" dir="ltr" lang="en"></article>
        <div class="pager">
          <button class="btn secondary" id="prevBtn" type="button"></button>
          <button class="btn secondary" id="nextBtn" type="button"></button>
        </div>
      </div>
    </section>

    <!-- Settings tab -->
    <section class="view" id="view-settings" aria-label="Settings">
      <div class="page-head"><h1 data-i18n="settingsTitle"></h1></div>

      <div class="group">
        <div class="row"><div class="lead" aria-hidden="true">◐</div>
          <div class="texts"><b data-i18n="language"></b><span data-i18n="languageHint"></span></div>
          <div class="seg" id="langSeg" role="group" aria-label="Language">
            <button type="button" data-lang="fa">فارسی</button>
            <button type="button" data-lang="en">English</button>
          </div>
        </div>
        <div class="row"><div class="lead" aria-hidden="true">◑</div>
          <div class="texts"><b data-i18n="appearance"></b><span data-i18n="appearanceHint"></span></div>
          <div class="seg" id="themeSeg" role="group" aria-label="Appearance">
            <button type="button" data-theme="auto" data-i18n="auto"></button>
            <button type="button" data-theme="light" data-i18n="light"></button>
            <button type="button" data-theme="dark" data-i18n="dark"></button>
          </div>
        </div>
        <div class="row"><div class="lead" aria-hidden="true">A</div>
          <div class="texts"><b data-i18n="fontSize"></b><span data-i18n="fontSizeHint"></span></div>
          <div class="seg" id="fontSeg" role="group" aria-label="Font size">
            <button type="button" data-font-size="small" data-i18n="fontSmall"></button>
            <button type="button" data-font-size="medium" data-i18n="fontMedium"></button>
            <button type="button" data-font-size="large" data-i18n="fontLarge"></button>
          </div>
        </div>
      </div>

      <div class="group">
        <div class="row"><div class="lead" aria-hidden="true">↻</div>
          <div class="texts"><b data-i18n="updateTitle"></b><span id="updateStatus"></span></div>
          <button class="btn secondary" id="checkUpdateBtn" type="button" data-i18n="updateCheck"></button>
        </div>
      </div>
      <p class="foot" id="lastChecked"></p>

      <div class="group">
        <div class="row"><div class="lead" aria-hidden="true">ⓘ</div>
          <div class="texts"><b data-i18n="aboutTitle"></b><span data-i18n="aboutText"></span></div>
        </div>
        <div class="row"><div class="lead" aria-hidden="true">✈</div>
          <div class="texts"><b data-i18n="offlineTitle"></b><span data-i18n="offlineNote"></span></div>
        </div>
        <div class="row"><div class="lead" aria-hidden="true">◌</div>
          <div class="texts"><b data-i18n="noCacheTitle"></b><span data-i18n="noCacheNote"></span></div>
        </div>
        <div class="row"><div class="lead" aria-hidden="true">©</div>
          <div class="texts"><b data-i18n="attributionTitle"></b><span data-i18n="attribution"></span></div>
        </div>
      </div>

      <div class="group">
        <button class="row danger" id="unloadBtn" type="button">
          <div class="lead" aria-hidden="true">✕</div>
          <div class="texts"><b data-i18n="unloadCapsule"></b><span data-i18n="unloadHint"></span></div>
        </button>
      </div>
      <p class="foot" id="verFoot"></p>
    </section>
  </main>
</div>

<div class="tabdock">
  <nav class="tabbar" id="tabbar" aria-label="Tabs"></nav>
</div>

<div class="caps-back" id="capsBack"></div>
<aside class="caps-panel" id="capsPanel" aria-label="Loaded capsules">
  <div class="caps-panel-head"><b data-i18n="loadedCapsules"></b><button class="mini" id="capsClose" type="button" aria-label="Close">✕</button></div>
  <div id="capsPanelList"></div>
  <button class="btn" id="capsAddBtn" type="button" data-i18n="loadAnother"></button>
</aside>
<input type="file" id="fileInput" accept=".zip,application/zip" hidden>
<noscript><p style="padding:24px">OffDoc needs JavaScript.</p></noscript>
</body>
</html>
